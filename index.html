<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Capture, Crop with White Circle Detection & Dynamic World Mapping</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Screen Capture, Crop with White Circle Detection & Dynamic World Mapping</h1>
  </header>
  <main>
    <section id="capture-section">
      <button id="startCaptureButton">Start Screen Capture</button>
      <div id="videoContainer">
        <video id="screenVideo" autoplay playsinline></video>
        <!-- Overlay for cropping selection -->
        <div id="cropOverlay"></div>
      </div>
    </section>
    <section id="crop-output">
      <h2>Cropped Output</h2>
      <canvas id="cropCanvas"></canvas>
      <button id="autoMapButton">Start Auto Map</button>
    </section>
    <section id="map-output">
      <h2>Mapped Feed</h2>
      <canvas id="mapCanvas"></canvas>
    </section>
    <section id="world-map-output">
      <h2>Live World Map</h2>
      <canvas id="worldMapCanvas"></canvas>
      <div id="movementInfo">
        <h3>Player Movement</h3>
        <p id="directionDisplay">No movement yet</p>
        <ul id="movementList"></ul>
      </div>
    </section>
  </main>
  <script type="module" src="main.js"></script>

</body>
</html>
